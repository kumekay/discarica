version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - noctx
    - bodyclose
  exclusions:
    rules:
      # Test helpers close response bodies via t.Cleanup, which bodyclose cannot
      # see; context plumbing is irrelevant in test clients.
      - path: _test\.go
        linters: [bodyclose, noctx]

formatters:
  enable:
    - gofmt
    - goimports
